# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Load Balancer

on:
  pull_request:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'

jobs:
  build-loadbalancer:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
      working-directory: LoadBalancerProject-DONT-IMPORT-INTO-UNITY
    - name: Build
      run: dotnet build --no-restore
      working-directory: LoadBalancerProject-DONT-IMPORT-INTO-UNITY
    - name: Upload LRM
      uses: actions/upload-artifact@v4
      with:
        name: LRM-LoadBalancer
        path: |
          LoadBalancerProject-DONT-IMPORT-INTO-UNITY/LRM_LoadBalancer/bin/Debug/net8.0/LRM_LoadBalancer.dll
          LoadBalancerProject-DONT-IMPORT-INTO-UNITY/LRM_LoadBalancer/bin/Debug/net8.0/LRM_LoadBalancer.runtimeconfig.json
